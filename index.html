  <script>
    const elements = [{"number":1,"symbol":"H","name":"Hydrogen","zuluName":"Ihwanzi","atomic_mass":1.008,"melt":13.99,"boil":20.271,"phase":"Gas","category":"diatomic nonmetal","group":1,"period":1,"xpos":1,"ypos":1,"summary":"Hydrogen is a chemical element with chemical symbol H and atomic number 1. With an atomic weight of 1.00794 u, hydrogen is the lightest element on the periodic table. Its monatomic form (H) is the most abundant chemical substance in the Universe, constituting roughly 75% of all baryonic mass."},{"number":2,"symbol":"He","name":"Helium","zuluName":"Ihwelanga","atomic_mass":4.0026022,"melt":0.95,"boil":4.222,"phase":"Gas","category":"noble gas","group":18,"period":1,"xpos":18,"ypos":1,"summary":"Helium is a chemical element with symbol He and atomic number 2. It is a colorless, odorless, tasteless, non-toxic, inert, monatomic gas that heads the noble gas group in the periodic table. Its boiling and melting points are the lowest among all the elements."},{"number":3,"symbol":"Li","name":"Lithium","zuluName":"Umthanya","atomic_mass":6.94,"melt":453.65,"boil":1603,"phase":"Solid","category":"alkali metal","group":1,"period":2,"xpos":1,"ypos":2,"summary":"Lithium (from Greek:λίθος lithos, \"stone\") is a chemical element with the symbol Li and atomic number 3. It is a soft, silver-white metal belonging to the alkali metal group of chemical elements. Under standard conditions it is the lightest metal and the least dense solid element."},{"number":4,"symbol":"Be","name":"Beryllium","zuluName":"Ibehlezani","atomic_mass":9.01218315,"melt":1560,"boil":2742,"phase":"Solid","category":"alkaline earth metal","group":2,"period":2,"xpos":2,"ypos":2,"summary":"Beryllium is a chemical element with symbol Be and atomic number 4. It is created through stellar nucleosynthesis and is a relatively rare element in the universe. It is a divalent element which occurs naturally only in combination with other elements in minerals."},{"number":5,"symbol":"B","name":"Boron","zuluName":"Umbolhwa","atomic_mass":10.81,"melt":2349,"boil":4200,"phase":"Solid","category":"metalloid","group":13,"period":2,"xpos":13,"ypos":2,"summary":"Boron is a metalloid chemical element with symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae and not by stellar nucleosynthesis, it is a low-abundance element in both the Solar system and the Earth's crust. Boron is concentrated on Earth by the water-solubility of its more common naturally occurring compounds, the borate minerals."},{"number":6,"symbol":"C","name":"Carbon","zuluName":"Umcalahle","atomic_mass":12.011,"melt":null,"boil":null,"phase":"Solid","category":"polyatomic nonmetal","group":14,"period":2,"xpos":14,"ypos":2,"summary":"Carbon (from Latin:carbo \"coal\") is a chemical element with symbol C and atomic number 6. On the periodic table, it is the first (row 2) of six elements in column (group) 14, which have in common the composition of their outer electron shell. It is nonmetallic and tetravalent—making four electrons available to form covalent chemical bonds."},{"number":7,"symbol":"N","name":"Nitrogen","zuluName":"Inihwe","atomic_mass":14.007,"melt":63.15,"boil":77.355,"phase":"Gas","category":"diatomic nonmetal","group":15,"period":2,"xpos":15,"ypos":2,"summary":"Nitrogen is a chemical element with symbol N and atomic number 7. It is the lightest pnictogen and at room temperature, it is a transparent, odorless diatomic gas. Nitrogen is a common element in the universe, estimated at about seventh in total abundance in the Milky Way and the Solar System."},{"number":8,"symbol":"O","name":"Oxygen","zuluName":"Isohwe","atomic_mass":15.999,"melt":54.36,"boil":90.188,"phase":"Gas","category":"diatomic nonmetal","group":16,"period":2,"xpos":16,"ypos":2,"summary":"Oxygen is a chemical element with symbol O and atomic number 8. It is a member of the chalcogen group on the periodic table and is a highly reactive nonmetal and oxidizing agent that readily forms compounds (notably oxides) with most elements. By mass, oxygen is the third-most abundant element in the universe, after hydrogen and helium."},{"number":9,"symbol":"F","name":"Fluorine","zuluName":"Ufusiwe","atomic_mass":18.9984031636,"melt":53.48,"boil":85.03,"phase":"Gas","category":"diatomic nonmetal","group":17,"period":2,"xpos":17,"ypos":2,"summary":"Fluorine is a chemical element with symbol F and atomic number 9. It is the lightest halogen and exists as a highly toxic pale yellow diatomic gas at standard conditions. As the most electronegative element, it is extremely reactive:almost all other elements, including some noble gases, form compounds with fluorine."},{"number":10,"symbol":"Ne","name":"Neon","zuluName":"Inkanyiwe","atomic_mass":20.17976,"melt":24.56,"boil":27.104,"phase":"Gas","category":"noble gas","group":18,"period":2,"xpos":18,"ypos":2,"summary":"Neon is a chemical element with symbol Ne and atomic number 10. It is in group 18 (noble gases) of the periodic table. Neon is a colorless, odorless, inert monatomic gas under standard conditions, with about two-thirds the density of air."},{"number":11,"symbol":"Na","name":"Sodium","zuluName":"Inaside","atomic_mass":22.989769282,"melt":370.944,"boil":1156.09,"phase":"Solid","category":"alkali metal","group":1,"period":3,"xpos":1,"ypos":3,"summary":"Sodium /ˈsoʊdiəm/ is a chemical element with symbol Na (from Ancient Greek Νάτριο) and atomic number 11. It is a soft, silver-white, highly reactive metal. In the Periodic table it is in column 1 (alkali metals), and shares with the other six elements in that column that it has a single electron in its outer shell, which it readily donates, creating a positively charged atom - a cation."},{"number":12,"symbol":"Mg","name":"Magnesium","zuluName":"Umgethe","atomic_mass":24.305,"melt":923,"boil":1363,"phase":"Solid","category":"alkaline earth metal","group":2,"period":3,"xpos":2,"ypos":3,"summary":"Magnesium is a chemical element with symbol Mg and atomic number 12. It is a shiny gray solid which bears a close physical resemblance to the other five elements in the second column (Group 2, or alkaline earth metals) of the periodic table:they each have the same electron configuration in their outer electron shell producing a similar crystal structure. Magnesium is the ninth most abundant element in the universe."},{"number":13,"symbol":"Al","name":"Aluminium","zuluName":"Isalumbe","atomic_mass":26.98153857,"melt":933.47,"boil":2743,"phase":"Solid","category":"post-transition metal","group":13,"period":3,"xpos":13,"ypos":3,"summary":"Aluminium (or aluminum; see different endings) is a chemical element in the boron group with symbol Al and atomic number 13. It is a silvery-white, soft, nonmagnetic, ductile metal. Aluminium is the third most abundant element (after oxygen and silicon), and the most abundant metal, in the Earth's crust."},{"number":14,"symbol":"Si","name":"Silicon","zuluName":"Isiphemba","atomic_mass":28.085,"melt":1687,"boil":3538,"phase":"Solid","category":"metalloid","group":14,"period":3,"xpos":14,"ypos":3,"summary":"Silicon is a chemical element with symbol Si and atomic number 14. It is a tetravalent metalloid, more reactive than germanium, the metalloid directly below it in the table. Controversy about silicon's character dates to its discovery."},{"number":15,"symbol":"P","name":"Phosphorus","zuluName":"Ipholoba","atomic_mass":30.9737619985,"melt":null,"boil":null,"phase":"Solid","category":"polyatomic nonmetal","group":15,"period":3,"xpos":15,"ypos":3,"summary":"Phosphorus is a chemical element with symbol P and atomic number 15. As an element, phosphorus exists in two major forms—white phosphorus and red phosphorus—but due to its high reactivity, phosphorus is never found as a free element on Earth. Instead phosphorus-containing minerals are almost always present in their maximally oxidised state, as inorganic phosphate rocks."},{"number":16,"symbol":"S","name":"Sulfur","zuluName":"Isibabuli","atomic_mass":32.06,"melt":388.36,"boil":717.8,"phase":"Solid","category":"polyatomic nonmetal","group":16,"period":3,"xpos":16,"ypos":3,"summary":"Sulfur or sulphur (see spelling differences) is a chemical element with symbol S and atomic number 16. It is an abundant, multivalent non-metal. Under normal conditions, sulfur atoms form cyclic octatomic molecules with chemical formula S8."},{"number":17,"symbol":"Cl","name":"Chlorine","zuluName":"Ichwenzi","atomic_mass":35.45,"melt":171.6,"boil":239.11,"phase":"Gas","category":"diatomic nonmetal","group":17,"period":3,"xpos":17,"ypos":3,"summary":"Chlorine is a chemical element with symbol Cl and atomic number 17. It also has a relative atomic mass of 35.5. Chlorine is in the halogen group (17) and is the second lightest halogen following fluorine."},{"number":18,"symbol":"Ar","name":"Argon","zuluName":"Isalahwe","atomic_mass":39.9481,"melt":83.81,"boil":87.302,"phase":"Gas","category":"noble gas","group":18,"period":3,"xpos":18,"ypos":3,"summary":"Argon is a chemical element with symbol Ar and atomic number 18. It is in group 18 of the periodic table and is a noble gas. Argon is the third most common gas in the Earth's atmosphere, at 0.934% (9,340 ppmv), making it over twice as abundant as the next most common atmospheric gas, water vapor (which averages about 4000 ppmv, but varies greatly), and 23 times as abundant as the next most common non-condensing atmospheric gas, carbon dioxide (400 ppmv), and more than 500 times as abundant as the next most common noble gas, neon (18 ppmv)."},{"number":19,"symbol":"K","name":"Potassium","zuluName":"Umkhosha","atomic_mass":39.09831,"melt":336.7,"boil":1032,"phase":"Solid","category":"alkali metal","group":1,"period":4,"xpos":1,"ypos":4,"summary":"Potassium is a chemical element with symbol K (derived from Neo-Latin, kalium) and atomic number 19. It was first isolated from potash, the ashes of plants, from which its name is derived. In the Periodic table, potassium is one of seven elements in column (group) 1 (alkali metals):they all have a single valence electron in their outer electron shell, which they readily give up to create an atom with a positive charge - a cation, and combine with anions to form salts."},{"number":20,"symbol":"Ca","name":"Calcium","zuluName":"Umcaphana","atomic_mass":40.0784,"melt":1115,"boil":1757,"phase":"Solid","category":"alkaline earth metal","group":2,"period":4,"xpos":2,"ypos":4,"summary":"Calcium is a chemical element with symbol Ca and atomic number 20. Calcium is a soft gray alkaline earth metal, fifth-most-abundant element by mass in the Earth's crust. The ion Ca2+ is also the fifth-most-abundant dissolved ion in seawater by both molarity and mass, after sodium, chloride, magnesium, and sulfate."},{"number":21,"symbol":"Sc","name":"Scandium","zuluName":"Isicambi","atomic_mass":44.9559085,"melt":1814,"boil":3109,"phase":"Solid","category":"transition metal","group":3,"period":4,"xpos":3,"ypos":4,"summary":"Scandium is a chemical element with symbol Sc and atomic number 21. A silvery-white metallic d-block element, it has historically been sometimes classified as a rare earth element, together with yttrium and the lanthanoids. It was discovered in 1879 by spectral analysis of the minerals euxenite and gadolinite from Scandinavia."},{"number":22,"symbol":"Ti","name":"Titanium","zuluName":"Intsazayiya","atomic_mass":47.8671,"melt":1941,"boil":3560,"phase":"Solid","category":"transition metal","group":4,"period":4,"xpos":4,"ypos":4,"summary":"Titanium is a chemical element with symbol Ti and atomic number 22. It is a lustrous transition metal with a silver color, low density and high strength. It is highly resistant to corrosion in sea water, aqua regia and chlorine."},{"number":23,"symbol":"V","name":"Vanadium","zuluName":"Uvathofi","atomic_mass":50.94151,"melt":2183,"boil":3680,"phase":"Solid","category":"transition metal","group":5,"period":4,"xpos":5,"ypos":4,"summary":"Vanadium is a chemical element with symbol V and atomic number 23. It is a hard, silvery grey, ductile and malleable transition metal. The element is found only in chemically combined form in nature, but once isolated artificially, the formation of an oxide layer stabilizes the free metal somewhat against further oxidation."},{"number":24,"symbol":"Cr","name":"Chromium","zuluName":"Umchiyanggwala","atomic_mass":51.99616,"melt":2180,"boil":2944,"phase":"Solid","category":"transition metal","group":6,"period":4,"xpos":6,"ypos":4,"summary":"Chromium is a chemical element with symbol Cr and atomic number 24. It is the first element in Group 6. It is a steely-gray, lustrous, hard and brittle metal which takes a high polish, resists tarnishing, and has a high melting point."},{"number":25,"symbol":"Mn","name":"Manganese","zuluName":"Umnyazambi","atomic_mass":54.9380443,"melt":1519,"boil":2334,"phase":"Solid","category":"transition metal","group":7,"period":4,"xpos":7,"ypos":4,"summary":"Manganese is a chemical element with symbol Mn and atomic number 25. It is not found as a free element in nature; it is often found in combination with iron, and in many minerals. Manganese is a metal with important industrial metal alloy uses, particularly in stainless steels."},{"number":26,"symbol":"Fe","name":"Iron","zuluName":"Insimbi","atomic_mass":55.8452,"melt":1811,"boil":3134,"phase":"Solid","category":"transition metal","group":8,"period":4,"xpos":8,"ypos":4,"summary":"Iron is a chemical element with symbol Fe (from Latin:ferrum) and atomic number 26. It is a metal in the first transition series. It is by mass the most common element on Earth, forming much of Earth's outer and inner core."},{"number":27,"symbol":"Co","name":"Cobalt","zuluName":"Umconjambi","atomic_mass":58.9331944,"melt":1768,"boil":3200,"phase":"Solid","category":"transition metal","group":9,"period":4,"xpos":9,"ypos":4,"summary":"Cobalt is a chemical element with symbol Co and atomic number 27. Like nickel, cobalt in the Earth's crust is found only in chemically combined form, save for small deposits found in alloys of natural meteoric iron. The free element, produced by reductive smelting, is a hard, lustrous, silver-gray metal."},{"number":28,"symbol":"Ni","name":"Nickel","zuluName":"Isinimbi","atomic_mass":58.69344,"melt":1728,"boil":3003,"phase":"Solid","category":"transition metal","group":10,"period":4,"xpos":10,"ypos":4,"summary":"Nickel is a chemical element with symbol Ni and atomic number 28. It is a silvery-white lustrous metal with a slight golden tinge. Nickel belongs to the transition metals and is hard and ductile."},{"number":29,"symbol":"Cu","name":"Copper","zuluName":"Usokhele","atomic_mass":63.5463,"melt":1357.77,"boil":2835,"phase":"Solid","category":"transition metal","group":11,"period":4,"xpos":11,"ypos":4,"summary":"Copper is a chemical element with symbol Cu (from Latin:cuprum) and atomic number 29. It is a soft, malleable and ductile metal with very high thermal and electrical conductivity. A freshly exposed surface of pure copper has a reddish-orange color."},{"number":30,"symbol":"Zn","name":"Zinc","zuluName":"Izethe","atomic_mass":65.382,"melt":692.68,"boil":1180,"phase":"Solid","category":"transition metal","group":12,"period":4,"xpos":12,"ypos":4,"summary":"Zinc, in commerce also spelter, is a chemical element with symbol Zn and atomic number 30. It is the first element of group 12 of the periodic table. In some respects zinc is chemically similar to magnesium:its ion is of similar size and its only common oxidation state is +2."},{"number":31,"symbol":"Ga","name":"Gallium","zuluName":"Umgambana","atomic_mass":69.7231,"melt":302.9146,"boil":2673,"phase":"Solid","category":"post-transition metal","group":13,"period":4,"xpos":13,"ypos":4,"summary":"Gallium is a chemical element with symbol Ga and atomic number 31. Elemental gallium does not occur in free form in nature, but as the gallium(III) compounds that are in trace amounts in zinc ores and in bauxite. Gallium is a soft, silvery metal, and elemental gallium is a brittle solid at low temperatures, and melts at 29.76 °C (85.57 °F) (slightly above room temperature)."},{"number":32,"symbol":"Ge","name":"Germanium","zuluName":"Umgwangaza","atomic_mass":72.6308,"melt":1211.4,"boil":3106,"phase":"Solid","category":"metalloid","group":14,"period":4,"xpos":14,"ypos":4,"summary":"Germanium is a chemical element with symbol Ge and atomic number 32. It is a lustrous, hard, grayish-white metalloid in the carbon group, chemically similar to its group neighbors tin and silicon. Purified germanium is a semiconductor, with an appearance most similar to elemental silicon."},{"number":33,"symbol":"As","name":"Arsenic","zuluName":"Isasumu","atomic_mass":74.9215956,"melt":null,"boil":null,"phase":"Solid","category":"metalloid","group":15,"period":4,"xpos":15,"ypos":4,"summary":"Arsenic is a chemical element with symbol As and atomic number 33. Arsenic occurs in many minerals, usually in conjunction with sulfur and metals, and also as a pure elemental crystal. Arsenic is a metalloid."},{"number":34,"symbol":"Se","name":"Selenium","zuluName":"Isewezi","atomic_mass":78.9718,"melt":494,"boil":958,"phase":"Solid","category":"polyatomic nonmetal","group":16,"period":4,"xpos":16,"ypos":4,"summary":"Selenium is a chemical element with symbol Se and atomic number 34. It is a nonmetal with properties that are intermediate between those of its periodic table column-adjacent chalcogen elements sulfur and tellurium. It rarely occurs in its elemental state in nature, or as pure ore compounds."},{"number":35,"symbol":"Br","name":"Bromine","zuluName":"Umbhulufu","atomic_mass":79.904,"melt":265.8,"boil":332,"phase":"Liquid","category":"diatomic nonmetal","group":17,"period":4,"xpos":17,"ypos":4,"summary":"Bromine (from Ancient Greek:βρῶμος, brómos, meaning \"stench\") is a chemical element with symbol Br, and atomic number 35. It is a halogen. The element was isolated independently by two chemists, Carl Jacob Löwig and Antoine Jerome Balard, in 1825–1826."},{"number":36,"symbol":"Kr","name":"Krypton","zuluName":"Umkhalawe","atomic_mass":83.7982,"melt":115.78,"boil":119.93,"phase":"Gas","category":"noble gas","group":18,"period":4,"xpos":18,"ypos":4,"summary":"Krypton (from Greek:κρυπτός kryptos \"the hidden one\") is a chemical element with symbol Kr and atomic number 36. It is a member of group 18 (noble gases) elements. A colorless, odorless, tasteless noble gas, krypton occurs in trace amounts in the atmosphere, is isolated by fractionally distilling liquefied air, and is often used with other rare gases in fluorescent lamps."},{"number":37,"symbol":"Rb","name":"Rubidium","zuluName":"ILubimbo","atomic_mass":85.46783,"melt":312.45,"boil":961,"phase":"Solid","category":"alkali metal","group":1,"period":5,"xpos":1,"ypos":5,"summary":"Rubidium is a chemical element with symbol Rb and atomic number 37. Rubidium is a soft, silvery-white metallic element of the alkali metal group, with an atomic mass of 85.4678. Elemental rubidium is highly reactive, with properties similar to those of other alkali metals, such as very rapid oxidation in air."},{"number":38,"symbol":"Sr","name":"Strontium","zuluName":"Isolombi","atomic_mass":87.621,"melt":1050,"boil":1650,"phase":"Solid","category":"alkaline earth metal","group":2,"period":5,"xpos":2,"ypos":5,"summary":"Strontium is a chemical element with symbol Sr and atomic number 38. An alkaline earth metal, strontium is a soft silver-white or yellowish metallic element that is highly reactive chemically. The metal turns yellow when it is exposed to air."},{"number":39,"symbol":"Y","name":"Yttrium","zuluName":"Umyambi","atomic_mass":88.905842,"melt":1799,"boil":3203,"phase":"Solid","category":"transition metal","group":3,"period":5,"xpos":3,"ypos":5,"summary":"Yttrium is a chemical element with symbol Y and atomic number 39. It is a silvery-metallic transition metal chemically similar to the lanthanides and it has often been classified as a \"rare earth element\". Yttrium is almost always found combined with the lanthanides in rare earth minerals and is never found in nature as a free element."},{"number":40,"symbol":"Zr","name":"Zirconium","zuluName":"Izambedu","atomic_mass":91.2242,"melt":2128,"boil":4650,"phase":"Solid","category":"transition metal","group":4,"period":5,"xpos":4,"ypos":5,"summary":"Zirconium is a chemical element with symbol Zr and atomic number 40. The name of zirconium is taken from the name of the mineral zircon, the most important source of zirconium. The word zircon comes from the Persian word zargun زرگون, meaning \"gold-colored\"."},{"number":41,"symbol":"Nb","name":"Niobium","zuluName":"Inobo","atomic_mass":92.906372,"melt":2750,"boil":5017,"phase":"Solid","category":"transition metal","group":5,"period":5,"xpos":5,"ypos":5,"summary":"Niobium, formerly columbium, is a chemical element with symbol Nb (formerly Cb) and atomic number 41. It is a soft, grey, ductile transition metal, which is often found in the pyrochlore mineral, the main commercial source for niobium, and columbite. The name comes from Greek mythology:Niobe, daughter of Tantalus since it is so similar to tantalum."},{"number":42,"symbol":"Mo","name":"Molybdenum","zuluName":"Umophobo","atomic_mass":95.951,"melt":2896,"boil":4912,"phase":"Solid","category":"transition metal","group":6,"period":5,"xpos":6,"ypos":5,"summary":"Molybdenum is a chemical element with symbol Mo and atomic number 42. The name is from Neo-Latin molybdaenum, from Ancient Greek Μόλυβδος molybdos, meaning lead, since its ores were confused with lead ores. Molybdenum minerals have been known throughout history, but the element was discovered (in the sense of differentiating it as a new entity from the mineral salts of other metals) in 1778 by Carl Wilhelm Scheele."},{"number":43,"symbol":"Tc","name":"Technetium","zuluName":"Umthanyambi","atomic_mass":98,"melt":2430,"boil":4538,"phase":"Solid","category":"transition metal","group":7,"period":5,"xpos":7,"ypos":5,"summary":"Technetium (/tɛkˈniːʃiəm/) is a chemical element with symbol Tc and atomic number 43. It is the element with the lowest atomic number in the periodic table that has no stable isotopes:every form of it is radioactive. Nearly all technetium is produced synthetically, and only minute amounts are found in nature."},{"number":44,"symbol":"Ru","name":"Ruthenium","zuluName":"Isalanqwali","atomic_mass":101.072,"melt":2607,"boil":4423,"phase":"Solid","category":"transition metal","group":8,"period":5,"xpos":8,"ypos":5,"summary":"Ruthenium is a chemical element with symbol Ru and atomic number 44. It is a rare transition metal belonging to the platinum group of the periodic table. Like the other metals of the platinum group, ruthenium is inert to most other chemicals."},{"number":45,"symbol":"Rh","name":"Rhodium","zuluName":"Ulundu","atomic_mass":102.905502,"melt":2237,"boil":3968,"phase":"Solid","category":"transition metal","group":9,"period":5,"xpos":9,"ypos":5,"summary":"Rhodium is a chemical element with symbol Rh and atomic number 45. It is a rare, silvery-white, hard, and chemically inert transition metal. It is a member of the platinum group."},{"number":46,"symbol":"Pd","name":"Palladium","zuluName":"Impanda","atomic_mass":106.421,"melt":1828.05,"boil":3236,"phase":"Solid","category":"transition metal","group":10,"period":5,"xpos":10,"ypos":5,"summary":"Palladium is a chemical element with symbol Pd and atomic number 46. It is a rare and lustrous silvery-white metal discovered in 1803 by William Hyde Wollaston. He named it after the asteroid Pallas, which was itself named after the epithet of the Greek goddess Athena, acquired by her when she slew Pallas."},{"number":47,"symbol":"Ag","name":"Silver","zuluName":"Icwebe","atomic_mass":107.86822,"melt":1234.93,"boil":2435,"phase":"Solid","category":"transition metal","group":11,"period":5,"xpos":11,"ypos":5,"summary":"Silver is a chemical element with symbol Ag (Greek:άργυρος árguros, Latin:argentum, both from the Indo-European root *h₂erǵ- for \"grey\" or \"shining\") and atomic number 47. A soft, white, lustrous transition metal, it possesses the highest electrical conductivity, thermal conductivity and reflectivity of any metal. The metal occurs naturally in its pure, free form (native silver), as an alloy with gold and other metals, and in minerals such as argentite and chlorargyrite."},{"number":48,"symbol":"Cd","name":"Cadmium","zuluName":"Umkhathofi","atomic_mass":112.4144,"melt":594.22,"boil":1040,"phase":"Solid","category":"transition metal","group":12,"period":5,"xpos":12,"ypos":5,"summary":"Cadmium is a chemical element with symbol Cd and atomic number 48. This soft, bluish-white metal is chemically similar to the two other stable metals in group 12, zinc and mercury. Like zinc, it prefers oxidation state +2 in most of its compounds and like mercury it shows a low melting point compared to transition metals."},{"number":49,"symbol":"In","name":"Indium","zuluName":"Inzulumbi","atomic_mass":114.8181,"melt":429.7485,"boil":2345,"phase":"Solid","category":"post-transition metal","group":13,"period":5,"xpos":13,"ypos":5,"summary":"Indium is a chemical element with symbol In and atomic number 49. It is a post-transition metallic element that is rare in Earth's crust. The metal is very soft, malleable and easily fusible, with a melting point higher than sodium, but lower than lithium or tin."},{"number":50,"symbol":"Sn","name":"Tin","zuluName":"Isithanambi","atomic_mass":118.7107,"melt":505.08,"boil":2875,"phase":"Solid","category":"post-transition metal","group":14,"period":5,"xpos":14,"ypos":5,"summary":"Tin is a chemical element with the symbol Sn (for Latin:stannum) and atomic number 50. It is a main group metal in group 14 of the periodic table. Tin shows a chemical similarity to both neighboring group-14 elements, germanium and lead, and has two possible oxidation states, +2 and the slightly more stable +4."},{"number":51,"symbol":"Sb","name":"Antimony","zuluName":"Isibidani","atomic_mass":121.7601,"melt":903.78,"boil":1908,"phase":"Solid","category":"metalloid","group":15,"period":5,"xpos":15,"ypos":5,"summary":"Antimony is a chemical element with symbol Sb (from Latin:stibium) and atomic number 51. A lustrous gray metalloid, it is found in nature mainly as the sulfide mineral stibnite (Sb2S3). Antimony compounds have been known since ancient times and were used for cosmetics; metallic antimony was also known, but it was erroneously identified as lead upon its discovery."},{"number":52,"symbol":"Te","name":"Tellurium","zuluName":"Intehla","atomic_mass":127.603,"melt":722.66,"boil":1261,"phase":"Solid","category":"metalloid","group":16,"period":5,"xpos":16,"ypos":5,"summary":"Tellurium is a chemical element with symbol Te and atomic number 52. It is a brittle, mildly toxic, rare, silver-white metalloid. Tellurium is chemically related to selenium and sulfur."},{"number":53,"symbol":"I","name":"Iodine","zuluName":"Inkwithi","atomic_mass":126.904473,"melt":386.85,"boil":457.4,"phase":"Solid","category":"diatomic nonmetal","group":17,"period":5,"xpos":17,"ypos":5,"summary":"Iodine is a chemical element with symbol I and atomic number 53. The name is from Greek ἰοειδής ioeidēs, meaning violet or purple, due to the color of iodine vapor. Iodine and its compounds are primarily used in nutrition, and industrially in the production of acetic acid and certain polymers."},{"number":54,"symbol":"Xe","name":"Xenon","zuluName":"Ixhwe","atomic_mass":131.2936,"melt":161.4,"boil":165.051,"phase":"Gas","category":"noble gas","group":18,"period":5,"xpos":18,"ypos":5,"summary":"Xenon is a chemical element with symbol Xe and atomic number 54. It is a colorless, dense, odorless noble gas, that occurs in the Earth's atmosphere in trace amounts. Although generally unreactive, xenon can undergo a few chemical reactions such as the formation of xenon hexafluoroplatinate, the first noble gas compound to be synthesized."},{"number":55,"symbol":"Cs","name":"Cesium","zuluName":"Umcanga","atomic_mass":132.905451966,"melt":301.7,"boil":944,"phase":"Solid","category":"alkali metal","group":1,"period":6,"xpos":1,"ypos":6,"summary":"Caesium or cesium is a chemical element with symbol Cs and atomic number 55. It is a soft, silvery-gold alkali metal with a melting point of 28 °C (82 °F), which makes it one of only five elemental metals that are liquid at or near room temperature. Caesium is an alkali metal and has physical and chemical properties similar to those of rubidium and potassium."},{"number":56,"symbol":"Ba","name":"Barium","zuluName":"Umbhanya","atomic_mass":137.3277,"melt":1000,"boil":2118,"phase":"Solid","category":"alkaline earth metal","group":2,"period":6,"xpos":2,"ypos":6,"summary":"Barium is a chemical element with symbol Ba and atomic number 56. It is the fifth element in Group 2, a soft silvery metallic alkaline earth metal. Because of its high chemical reactivity barium is never found in nature as a free element."},{"number":57,"symbol":"La","name":"Lanthanum","zuluName":"ILalamthumbi","atomic_mass":138.905477,"melt":1193,"boil":3737,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":3,"ypos":9,"summary":"Lanthanum is a soft, ductile, silvery-white metallic chemical element with symbol La and atomic number 57. It tarnishes rapidly when exposed to air and is soft enough to be cut with a knife. It gave its name to the lanthanide series, a group of 15 similar elements between lanthanum and lutetium in the periodic table:it is also sometimes considered the first element of the 6th-period transition metals."},{"number":58,"symbol":"Ce","name":"Cerium","zuluName":"Ishambe","atomic_mass":140.1161,"melt":1068,"boil":3716,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":4,"ypos":9,"summary":"Cerium is a chemical element with symbol Ce and atomic number 58. It is a soft, silvery, ductile metal which easily oxidizes in air. Cerium was named after the dwarf planet Ceres (itself named after the Roman goddess of agriculture)."},{"number":59,"symbol":"Pr","name":"Praseodymium","zuluName":"Umphahlazambi","atomic_mass":140.907662,"melt":1208,"boil":3403,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":5,"ypos":9,"summary":"Praseodymium is a chemical element with symbol Pr and atomic number 59. Praseodymium is a soft, silvery, malleable and ductile metal in the lanthanide group. It is valued for its magnetic, electrical, chemical, and optical properties."},{"number":60,"symbol":"Nd","name":"Neodymium","zuluName":"Indalamhonyambi","atomic_mass":144.2423,"melt":1297,"boil":3347,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":6,"ypos":9,"summary":"Neodymium is a chemical element with symbol Nd and atomic number 60. It is a soft silvery metal that tarnishes in air. Neodymium was discovered in 1885 by the Austrian chemist Carl Auer von Welsbach."},{"number":61,"symbol":"Pm","name":"Promethium","zuluName":"Umphomethimbi","atomic_mass":145,"melt":1315,"boil":3273,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":7,"ypos":9,"summary":"Promethium, originally prometheum, is a chemical element with the symbol Pm and atomic number 61. All of its isotopes are radioactive; it is one of only two such elements that are followed in the periodic table by elements with stable forms, a distinction shared with technetium. Chemically, promethium is a lanthanide, which forms salts when combined with other elements."},{"number":62,"symbol":"Sm","name":"Samarium","zuluName":"Umsambi","atomic_mass":150.362,"melt":1345,"boil":2173,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":8,"ypos":9,"summary":"Samarium is a chemical element with symbol Sm and atomic number 62. It is a moderately hard silvery metal that readily oxidizes in air. Being a typical member of the lanthanide series, samarium usually assumes the oxidation state +3."},{"number":63,"symbol":"Eu","name":"Europium","zuluName":"Umnulundu","atomic_mass":151.9641,"melt":1099,"boil":1802,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":9,"ypos":9,"summary":"Europium is a chemical element with symbol Eu and atomic number 63. It was isolated in 1901 and is named after the continent of Europe. It is a moderately hard, silvery metal which readily oxidizes in air and water."},{"number":64,"symbol":"Gd","name":"Gadolinium","zuluName":"Umgedembulu","atomic_mass":157.253,"melt":1585,"boil":3273,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":10,"ypos":9,"summary":"Gadolinium is a chemical element with symbol Gd and atomic number 64. It is a silvery-white, malleable and ductile rare-earth metal. It is found in nature only in combined (salt) form."},{"number":65,"symbol":"Tb","name":"Terbium","zuluName":"Umthabathofi","atomic_mass":158.925352,"melt":1629,"boil":3396,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":11,"ypos":9,"summary":"Terbium is a chemical element with symbol Tb and atomic number 65. It is a silvery-white rare earth metal that is malleable, ductile and soft enough to be cut with a knife. Terbium is never found in nature as a free element, but it is contained in many minerals, including cerite, gadolinite, monazite, xenotime and euxenite."},{"number":66,"symbol":"Dy","name":"Dysprosium","zuluName":"Umdanyathofi","atomic_mass":162.5001,"melt":1680,"boil":2840,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":12,"ypos":9,"summary":"Dysprosium is a chemical element with the symbol Dy and atomic number 66. It is a rare earth element with a metallic silver luster. Dysprosium is never found in nature as a free element, though it is found in various minerals, such as xenotime."},{"number":67,"symbol":"Ho","name":"Holmium","zuluName":"Umhomambi","atomic_mass":164.930332,"melt":1734,"boil":2873,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":13,"ypos":9,"summary":"Holmium is a chemical element with symbol Ho and atomic number 67. Part of the lanthanide series, holmium is a rare earth element. Holmium was discovered by Swedish chemist Per Theodor Cleve."},{"number":68,"symbol":"Er","name":"Erbium","zuluName":"Indwembi","atomic_mass":167.2593,"melt":1802,"boil":3141,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":14,"ypos":9,"summary":"Erbium is a chemical element in the lanthanide series, with symbol Er and atomic number 68. A silvery-white solid metal when artificially isolated, natural erbium is always found in chemical combination with other elements on Earth. As such, it is a rare earth element which is associated with several other rare elements in the mineral gadolinite from Ytterby in Sweden, where yttrium, ytterbium, and terbium were discovered."},{"number":69,"symbol":"Tm","name":"Thulium","zuluName":"Umthuthumbi","atomic_mass":168.934222,"melt":1818,"boil":2223,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":15,"ypos":9,"summary":"Thulium is a chemical element with symbol Tm and atomic number 69. It is the thirteenth and antepenultimate (third-last) element in the lanthanide series. Like the other lanthanides, the most common oxidation state is +3, seen in its oxide, halides and other compounds."},{"number":70,"symbol":"Yb","name":"Ytterbium","zuluName":"Umyabambi","atomic_mass":173.0451,"melt":1097,"boil":1469,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":16,"ypos":9,"summary":"Ytterbium is a chemical element with symbol Yb and atomic number 70. It is the fourteenth and penultimate element in the lanthanide series, which is the basis of the relative stability of its +2 oxidation state. However, like the other lanthanides, its most common oxidation state is +3, seen in its oxide, halides and other compounds."},{"number":71,"symbol":"Lu","name":"Lutetium","zuluName":"Umluthambi","atomic_mass":174.96681,"melt":1925,"boil":3675,"phase":"Solid","category":"lanthanide","group":3,"period":6,"xpos":17,"ypos":9,"summary":"Lutetium is a chemical element with symbol Lu and atomic number 71. It is a silvery white metal, which resists corrosion in dry, but not in moist air. It is considered the first element of the 6th-period transition metals and the last element in the lanthanide series, and is traditionally counted among the rare earths."},{"number":72,"symbol":"Hf","name":"Hafnium","zuluName":"Umhlafantunge","atomic_mass":178.492,"melt":2506,"boil":4876,"phase":"Solid","category":"transition metal","group":4,"period":6,"xpos":4,"ypos":6,"summary":"Hafnium is a chemical element with symbol Hf and atomic number 72. A lustrous, silvery gray, tetravalent transition metal, hafnium chemically resembles zirconium and is found in zirconium minerals. Its existence was predicted by Dmitri Mendeleev in 1869, though it was not identified until 1923, making it the penultimate stable element to be discovered (rhenium was identified two years later)."},{"number":73,"symbol":"Ta","name":"Tantalum","zuluName":"Umthulumbi","atomic_mass":180.947882,"melt":3290,"boil":5731,"phase":"Solid","category":"transition metal","group":5,"period":6,"xpos":5,"ypos":6,"summary":"Tantalum is a chemical element with symbol Ta and atomic number 73. Previously known as tantalium, its name comes from Tantalus, an antihero from Greek mythology. Tantalum is a rare, hard, blue-gray, lustrous transition metal that is highly corrosion-resistant."},{"number":74,"symbol":"W","name":"Tungsten","zuluName":"Umzithowe","atomic_mass":183.841,"melt":3695,"boil":6203,"phase":"Solid","category":"transition metal","group":6,"period":6,"xpos":6,"ypos":6,"summary":"Tungsten, also known as wolfram, is a chemical element with symbol W and atomic number 74. The word tungsten comes from the Swedish language tung sten, which directly translates to heavy stone. Its name in Swedish is volfram, however, in order to distinguish it from scheelite, which in Swedish is alternatively named tungsten."},{"number":75,"symbol":"Re","name":"Rhenium","zuluName":"Umlenembi","atomic_mass":186.2071,"melt":3459,"boil":5869,"phase":"Solid","category":"transition metal","group":7,"period":6,"xpos":7,"ypos":6,"summary":"Rhenium is a chemical element with symbol Re and atomic number 75. It is a silvery-white, heavy, third-row transition metal in group 7 of the periodic table. With an estimated average concentration of 1 part per billion (ppb), rhenium is one of the rarest elements in the Earth's crust."},{"number":76,"symbol":"Os","name":"Osmium","zuluName":"Umosisivu","atomic_mass":190.233,"melt":3306,"boil":5285,"phase":"Solid","category":"transition metal","group":8,"period":6,"xpos":8,"ypos":6,"summary":"Osmium (from Greek osme (ὀσμή) meaning \"smell\") is a chemical element with symbol Os and atomic number 76. It is a hard, brittle, bluish-white transition metal in the platinum group that is found as a trace element in alloys, mostly in platinum ores. Osmium is the densest naturally occurring element, with a density of 22.59 g/cm3."},{"number":77,"symbol":"Ir","name":"Iridium","zuluName":"Imbidi","atomic_mass":192.2173,"melt":2719,"boil":4403,"phase":"Solid","category":"transition metal","group":9,"period":6,"xpos":9,"ypos":6,"summary":"Iridium is a chemical element with symbol Ir and atomic number 77. A very hard, brittle, silvery-white transition metal of the platinum group, iridium is generally credited with being the second densest element (after osmium) based on measured density, although calculations involving the space lattices of the elements show that iridium is denser. It is also the most corrosion-resistant metal, even at temperatures as high as 2000 °C. Although only certain molten salts and halogens are corrosive to solid iridium, finely divided iridium dust is much more reactive and can be flammable."},{"number":78,"symbol":"Pt","name":"Platinum","zuluName":"Ikhazi","atomic_mass":195.0849,"melt":2041.4,"boil":4098,"phase":"Solid","category":"transition metal","group":10,"period":6,"xpos":10,"ypos":6,"summary":"Platinum is a chemical element with symbol Pt and atomic number 78. It is a dense, malleable, ductile, highly unreactive, precious, gray-white transition metal. Its name is derived from the Spanish term platina, which is literally translated into \"little silver\"."},{"number":79,"symbol":"Au","name":"Gold","zuluName":"Imbedu","atomic_mass":196.9665695,"melt":1337.33,"boil":3243,"phase":"Solid","category":"transition metal","group":11,"period":6,"xpos":11,"ypos":6,"summary":"Gold is a chemical element with symbol Au (from Latin:aurum) and atomic number 79. In its purest form, it is a bright, slightly reddish yellow, dense, soft, malleable and ductile metal. Chemically, gold is a transition metal and a group 11 element."},{"number":80,"symbol":"Hg","name":"Mercury","zuluName":"Isigidi","atomic_mass":200.5923,"melt":234.321,"boil":629.88,"phase":"Liquid","category":"transition metal","group":12,"period":6,"xpos":12,"ypos":6,"summary":"Mercury is a chemical element with symbol Hg and atomic number 80. It is commonly known as quicksilver and was formerly named hydrargyrum (/haɪˈdrɑːrdʒərəm/). A heavy, silvery d-block element, mercury is the only metallic element that is liquid at standard conditions for temperature and pressure; the only other element that is liquid under these conditions is bromine, though metals such as caesium, gallium, and rubidium melt just above room temperature."},{"number":81,"symbol":"Tl","name":"Thallium","zuluName":"Umthohla","atomic_mass":204.38,"melt":577,"boil":1746,"phase":"Solid","category":"post-transition metal","group":13,"period":6,"xpos":13,"ypos":6,"summary":"Thallium is a chemical element with symbol Tl and atomic number 81. This soft gray post-transition metal is not found free in nature. When isolated, it resembles tin, but discolors when exposed to air."},{"number":82,"symbol":"Pb","name":"Lead","zuluName":"Umthofu","atomic_mass":207.21,"melt":600.61,"boil":2022,"phase":"Solid","category":"post-transition metal","group":14,"period":6,"xpos":14,"ypos":6,"summary":"Lead (/lɛd/) is a chemical element in the carbon group with symbol Pb (from Latin:plumbum) and atomic number 82. Lead is a soft, malleable and heavy post-transition metal. Metallic lead has a bluish-white color after being freshly cut, but it soon tarnishes to a dull grayish color when exposed to air."},{"number":83,"symbol":"Bi","name":"Bismuth","zuluName":"Ibima","atomic_mass":208.980401,"melt":544.7,"boil":1837,"phase":"Solid","category":"post-transition metal","group":15,"period":6,"xpos":15,"ypos":6,"summary":"Bismuth is a chemical element with symbol Bi and atomic number 83. Bismuth, a pentavalent post-transition metal, chemically resembles arsenic and antimony. Elemental bismuth may occur naturally, although its sulfide and oxide form important commercial ores."},{"number":84,"symbol":"Po","name":"Polonium","zuluName":"Imposumu","atomic_mass":209,"melt":527,"boil":1235,"phase":"Solid","category":"post-transition metal","group":16,"period":6,"xpos":16,"ypos":6,"summary":"Polonium is a chemical element with symbol Po and atomic number 84, discovered in 1898 by Marie Curie and Pierre Curie. A rare and highly radioactive element with no stable isotopes, polonium is chemically similar to bismuth and tellurium, and it occurs in uranium ores. Applications of polonium are few."},{"number":85,"symbol":"At","name":"Astatine","zuluName":"Isatsha","atomic_mass":210,"melt":575,"boil":610,"phase":"Solid","category":"metalloid","group":17,"period":6,"xpos":17,"ypos":6,"summary":"Astatine is a very rare radioactive chemical element with the chemical symbol At and atomic number 85. It occurs on Earth as the decay product of various heavier elements. All its isotopes are short-lived; the most stable is astatine-210, with a half-life of 8.1 hours."},{"number":86,"symbol":"Rn","name":"Radon","zuluName":"Umlahwe","atomic_mass":222,"melt":202,"boil":211.5,"phase":"Gas","category":"noble gas","group":18,"period":6,"xpos":18,"ypos":6,"summary":"Radon is a chemical element with symbol Rn and atomic number 86. It is a radioactive, colorless, odorless, tasteless noble gas, occurring naturally as a decay product of radium. Its most stable isotope, 222Rn, has a half-life of 3.8 days."},{"number":87,"symbol":"Fr","name":"Francium","zuluName":"Ishabalalambi","atomic_mass":223,"melt":300,"boil":950,"phase":"Solid","category":"alkali metal","group":1,"period":7,"xpos":1,"ypos":7,"summary":"Francium is a chemical element with symbol Fr and atomic number 87. It used to be known as eka-caesium and actinium K. It is the second-least electronegative element, behind only caesium. Francium is a highly radioactive metal that decays into astatine, radium, and radon."},{"number":88,"symbol":"Ra","name":"Radium","zuluName":"Umsebembi","atomic_mass":226,"melt":1233,"boil":2010,"phase":"Solid","category":"alkaline earth metal","group":2,"period":7,"xpos":2,"ypos":7,"summary":"Radium is a chemical element with symbol Ra and atomic number 88. It is the sixth element in group 2 of the periodic table, also known as the alkaline earth metals. Pure radium is almost colorless, but it readily combines with nitrogen (rather than oxygen) on exposure to air, forming a black surface layer of radium nitride (Ra3N2)."},{"number":89,"symbol":"Ac","name":"Actinium","zuluName":"Isacagu","atomic_mass":227,"melt":1500,"boil":3500,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":3,"ypos":10,"summary":"Actinium is a radioactive chemical element with symbol Ac (not to be confused with the abbreviation for an acetyl group) and atomic number 89, which was discovered in 1899. It was the first non-primordial radioactive element to be isolated. Polonium, radium and radon were observed before actinium, but they were not isolated until 1902."},{"number":90,"symbol":"Th","name":"Thorium","zuluName":"Isithomsizi","atomic_mass":232.03774,"melt":2023,"boil":5061,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":4,"ypos":10,"summary":"Thorium is a chemical element with symbol Th and atomic number 90. A radioactive actinide metal, thorium is one of only two significantly radioactive elements that still occur naturally in large quantities as a primordial element (the other being uranium). It was discovered in 1828 by the Norwegian Reverend and amateur mineralogist Morten Thrane Esmark and identified by the Swedish chemist Jöns Jakob Berzelius, who named it after Thor, the Norse god of thunder."},{"number":91,"symbol":"Pa","name":"Protactinium","zuluName":"Umphacagu","atomic_mass":231.035882,"melt":1841,"boil":4300,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":5,"ypos":10,"summary":"Protactinium is a chemical element with symbol Pa and atomic number 91. It is a dense, silvery-gray metal which readily reacts with oxygen, water vapor and inorganic acids. It forms various chemical compounds where protactinium is usually present in the oxidation state +5, but can also assume +4 and even +2 or +3 states."},{"number":92,"symbol":"U","name":"Uranium","zuluName":"Ishaqantuva","atomic_mass":238.028913,"melt":1405.3,"boil":4404,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":6,"ypos":10,"summary":"Uranium is a chemical element with symbol U and atomic number 92. It is a silvery-white metal in the actinide series of the periodic table. A uranium atom has 92 protons and 92 electrons, of which 6 are valence electrons."},{"number":93,"symbol":"Np","name":"Neptunium","zuluName":"Umnaphangana","atomic_mass":237,"melt":912,"boil":4447,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":7,"ypos":10,"summary":"Neptunium is a chemical element with symbol Np and atomic number 93. A radioactive actinide metal, neptunium is the first transuranic element. Its position in the periodic table just after uranium, named after the planet Uranus, led to it being named after Neptune, the next planet beyond Uranus."},{"number":94,"symbol":"Pu","name":"Plutonium","zuluName":"Impulu","atomic_mass":244,"melt":912.5,"boil":3505,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":8,"ypos":10,"summary":"Plutonium is a transuranic radioactive chemical element with symbol Pu and atomic number 94. It is an actinide metal of silvery-gray appearance that tarnishes when exposed to air, and forms a dull coating when oxidized. The element normally exhibits six allotropes and four oxidation states."},{"number":95,"symbol":"Am","name":"Americium","zuluName":"Isamoshi","atomic_mass":243,"melt":1449,"boil":2880,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":9,"ypos":10,"summary":"Americium is a radioactive transuranic chemical element with symbol Am and atomic number 95. This member of the actinide series is located in the periodic table under the lanthanide element europium, and thus by analogy was named after the Americas. Americium was first produced in 1944 by the group of Glenn T.Seaborg from Berkeley, California, at the metallurgical laboratory of University of Chicago."},{"number":96,"symbol":"Cm","name":"Curium","zuluName":"Ichumumbi","atomic_mass":247,"melt":1613,"boil":3383,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":10,"ypos":10,"summary":"Curium is a transuranic radioactive chemical element with symbol Cm and atomic number 96. This element of the actinide series was named after Marie and Pierre Curie – both were known for their research on radioactivity. Curium was first intentionally produced and identified in July 1944 by the group of Glenn T. Seaborg at the University of California, Berkeley."},{"number":97,"symbol":"Bk","name":"Berkelium","zuluName":"Imbeke","atomic_mass":247,"melt":1259,"boil":2900,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":11,"ypos":10,"summary":"Berkelium is a transuranic radioactive chemical element with symbol Bk and atomic number 97. It is a member of the actinide and transuranium element series. It is named after the city of Berkeley, California, the location of the University of California Radiation Laboratory where it was discovered in December 1949."},{"number":98,"symbol":"Cf","name":"Californium","zuluName":"Umngcalife","atomic_mass":251,"melt":1173,"boil":1743,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":12,"ypos":10,"summary":"Californium is a radioactive metallic chemical element with symbol Cf and atomic number 98. The element was first made in 1950 at the University of California Radiation Laboratory in Berkeley, by bombarding curium with alpha particles (helium-4 ions). It is an actinide element, the sixth transuranium element to be synthesized, and has the second-highest atomic mass of all the elements that have been produced in amounts large enough to see with the unaided eye (after einsteinium)."},{"number":99,"symbol":"Es","name":"Einsteinium","zuluName":"Isentshenye","atomic_mass":252,"melt":1133,"boil":1269,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":13,"ypos":10,"summary":"Einsteinium is a synthetic element with symbol Es and atomic number 99. It is the seventh transuranic element, and an actinide. Einsteinium was discovered as a component of the debris of the first hydrogen bomb explosion in 1952, and named after Albert Einstein."},{"number":100,"symbol":"Fm","name":"Fermium","zuluName":"Umfeme","atomic_mass":257,"melt":1800,"boil":null,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":14,"ypos":10,"summary":"Fermium is a synthetic element with symbol Fm and atomic number 100. It is a member of the actinide series. It is the heaviest element that can be formed by neutron bombardment of lighter elements, and hence the last element that can be prepared in macroscopic quantities, although pure fermium metal has not yet been prepared."},{"number":101,"symbol":"Md","name":"Mendelevium","zuluName":"Umendele","atomic_mass":258,"melt":1100,"boil":null,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":15,"ypos":10,"summary":"Mendelevium is a synthetic element with chemical symbol Md (formerly Mv) and atomic number 101. A metallic radioactive transuranic element in the actinide series, it is the first element that currently cannot be produced in macroscopic quantities through neutron bombardment of lighter elements. It is the antepenultimate actinide and the ninth transuranic element."},{"number":102,"symbol":"No","name":"Nobelium","zuluName":"Inombi","atomic_mass":259,"melt":1100,"boil":null,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":16,"ypos":10,"summary":"Nobelium is a synthetic chemical element with symbol No and atomic number 102. It is named in honor of Alfred Nobel, the inventor of dynamite and benefactor of science. A radioactive metal, it is the tenth transuranic element and is the penultimate member of the actinide series."},{"number":103,"symbol":"Lr","name":"Lawrencium","zuluName":"Umlangalambi","atomic_mass":266,"melt":1900,"boil":null,"phase":"Solid","category":"actinide","group":3,"period":7,"xpos":17,"ypos":10,"summary":"Lawrencium is a synthetic chemical element with chemical symbol Lr (formerly Lw) and atomic number 103. It is named in honor of Ernest Lawrence, inventor of the cyclotron, a device that was used to discover many artificial radioactive elements. A radioactive metal, lawrencium is the eleventh transuranic element and is also the final member of the actinide series."},{"number":104,"symbol":"Rf","name":"Rutherfordium","zuluName":"Umlefelambi","atomic_mass":267,"melt":2400,"boil":5800,"phase":"Solid","category":"transition metal","group":4,"period":7,"xpos":4,"ypos":7,"summary":"Rutherfordium is a chemical element with symbol Rf and atomic number 104, named in honor of physicist Ernest Rutherford. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 267Rf, has a half-life of approximately 1.3 hours. In the periodic table of the elements, it is a d - block element and the second of the fourth - row transition elements."},{"number":105,"symbol":"Db","name":"Dubnium","zuluName":"Umdubumbi","atomic_mass":268,"melt":null,"boil":null,"phase":"Solid","category":"transition metal","group":5,"period":7,"xpos":5,"ypos":7,"summary":"Dubnium is a chemical element with symbol Db and atomic number 105. It is named after the town of Dubna in Russia (north of Moscow), where it was first produced. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, dubnium-268, has a half-life of approximately 28 hours."},{"number":106,"symbol":"Sg","name":"Seaborgium","zuluName":"Isigamchibi","atomic_mass":269,"melt":null,"boil":null,"phase":"Solid","category":"transition metal","group":6,"period":7,"xpos":6,"ypos":7,"summary":"Seaborgium is a synthetic element with symbol Sg and atomic number 106. Its most stable isotope 271Sg has a half-life of 1.9 minutes. A more recently discovered isotope 269Sg has a potentially slightly longer half-life (ca."},{"number":107,"symbol":"Bh","name":"Bohrium","zuluName":"Ibhohombi","atomic_mass":270,"melt":null,"boil":null,"phase":"Solid","category":"transition metal","group":7,"period":7,"xpos":7,"ypos":7,"summary":"Bohrium is a chemical element with symbol Bh and atomic number 107. It is named after Danish physicist Niels Bohr. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 270Bh, has a half-life of approximately 61 seconds."},{"number":108,"symbol":"Hs","name":"Hassium","zuluName":"Umhasambi","atomic_mass":269,"melt":126,"boil":null,"phase":"Solid","category":"transition metal","group":8,"period":7,"xpos":8,"ypos":7,"summary":"Hassium is a chemical element with symbol Hs and atomic number 108, named after the German state of Hesse. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 269Hs, has a half-life of approximately 9.7 seconds, although an unconfirmed metastable state, 277mHs, may have a longer half-life of about 130 seconds. More than 100 atoms of hassium have been synthesized to date."},{"number":109,"symbol":"Mt","name":"Meitnerium","zuluName":"Umtshambi","atomic_mass":278,"melt":null,"boil":null,"phase":"Solid","category":"unknown, probably transition metal","group":9,"period":7,"xpos":9,"ypos":7,"summary":"Meitnerium is a chemical element with symbol Mt and atomic number 109. It is an extremely radioactive synthetic element (an element not found in nature that can be created in a laboratory). The most stable known isotope, meitnerium-278, has a half-life of 7.6 seconds."},{"number":110,"symbol":"Ds","name":"Darmstadtium","zuluName":"Idamasimbi","atomic_mass":281,"melt":null,"boil":null,"phase":"Solid","category":"unknown, probably transition metal","group":10,"period":7,"xpos":10,"ypos":7,"summary":"Darmstadtium is a chemical element with symbol Ds and atomic number 110. It is an extremely radioactive synthetic element. The most stable known isotope, darmstadtium-281, has a half-life of approximately 10 seconds."},{"number":111,"symbol":"Rg","name":"Roentgenium","zuluName":"Ilugambi","atomic_mass":282,"melt":null,"boil":null,"phase":"Solid","category":"unknown, probably transition metal","group":11,"period":7,"xpos":11,"ypos":7,"summary":"Roentgenium is a chemical element with symbol Rg and atomic number 111. It is an extremely radioactive synthetic element (an element that can be created in a laboratory but is not found in nature); the most stable known isotope, roentgenium-282, has a half-life of 2.1 minutes. Roentgenium was first created in 1994 by the GSI Helmholtz Centre for Heavy Ion Research near Darmstadt, Germany."},{"number":112,"symbol":"Cn","name":"Copernicium","zuluName":"Ichusinimbi","atomic_mass e of only 220 milliseconds. It is also known as eka-bismuth or simply element 115."},{"number":116,"symbol":"Lv","name":"Livermorium","zuluName":"ILivambi","atomic_mass":293,"melt":709,"boil":1085,"phase":"Solid","category":"unknown, probably post-transition metal","group":16,"period":7,"xpos":16,"ypos":7,"summary":"Livermorium is a synthetic superheavy element with symbol Lv and atomic number 116. It is an extremely radioactive element that has only been created in the laboratory and has not been observed in nature. The element is named after the Lawrence Livermore National Laboratory in the United States, which collaborated with the Joint Institute for Nuclear Research in Dubna, Russia to discover livermorium in 2000."},{"number":117,"symbol":"Ts","name":"Tennessine","zuluName":"Ithesembi","atomic_mass":294,"melt":723,"boil":883,"phase":"Solid","category":"unknown, probably metalloid","group":17,"period":7,"xpos":17,"ypos":7,"summary":"Tennessine is a superheavy artificial chemical element with an atomic number of 117 and a symbol of Ts. Also known as eka-astatine or element 117, it is the second-heaviest known element and penultimate element of the 7th period of the periodic table. As of 2016, fifteen tennessine atoms have been observed: six when it was first synthesized in 2010, seven in 2012, and two in 2014."},{"number":118,"symbol":"Og","name":"Oganesson","zuluName":"Isogambi","atomic_mass":294,"melt":null,"boil":350,"phase":"Solid","category":"unknown, predicted to be noble gas","group":18,"period":7,"xpos":18,"ypos":7,"summary":"Oganesson is IUPAC's name for the transactinide element with the atomic number 118 and element symbol Og. It is also known as eka-radon or element 118, and on the periodic table of the elements it is a p-block element and the last one of the 7th period. Oganesson is currently the only synthetic member of group 18."}];

    function renderDecorations(){
      // Pixel-sized reed bundles cross alternating binding cords.
      const mat=document.createElement('canvas');mat.width=mat.height=192;
      const c=mat.getContext('2d');c.imageSmoothingEnabled=false;
      const reeds=['#baa36f','#c5ad79','#d1ba87','#b09862'];
      for(let x=0;x<192;x+=4){c.fillStyle=reeds[(x/4)%4];c.fillRect(x,0,4,192);c.fillStyle='#deca9a';c.fillRect(x,0,1,192);
        for(let y=0;y<192;y+=12){c.fillStyle=(x/4+y/12)%2?'#887344':'#ad9662';c.fillRect(x,y+((x/4)%2)*3,4,2);}
      }
      const matTexture='url('+mat.toDataURL()+')';
      document.querySelector('.table-wrap').style.backgroundImage=matTexture;
      c.fillStyle='rgba(53,43,25,.16)';
      c.fillRect(0,0,mat.width,mat.height);
      const tapestryTexture='url('+mat.toDataURL()+')';
      document.querySelector('.ukhamba-hero').style.setProperty('--mat-texture',tapestryTexture);
      document.querySelector('.tile-key').style.setProperty('--mat-texture',tapestryTexture);

    function itemSymbols(item, el){const text=(item[1]||'').toLowerCase(); if(text.includes('water'))return 'H O'; if(text.includes('salt'))return 'Na Cl'; if(text.includes('steel'))return 'Fe C'; if(text.includes('battery'))return 'Li'; if(text.includes('glass'))return 'Si O'; if(text.includes('diamond'))return 'C'; return el.symbol;}
    function itemCard(item, el){const label=item[1]; return '<div class="item-card" style="--accent:'+cssColor(categoryClassForElement(el))+'"><canvas class="pixel-sprite" width="16" height="16" data-sprite="'+encodeURIComponent(label)+'" aria-hidden="true"></canvas><span class="item-label">'+label+'</span><span class="item-badge">'+itemSymbols(item, el)+'</span></div>'}

    function applyFilter(){let active=0; document.querySelectorAll('.element').forEach(tile=>{const match=activeFilter==='all'||tile.dataset.category===activeFilter; tile.classList.toggle('dimmed',!match); if(match)active+=1;}); document.querySelectorAll('.series-label').forEach(label=>{const match=activeFilter==='all'||label.dataset.category===activeFilter; label.classList.toggle('dimmed',!match);}); countText.textContent=activeFilter==='all'?'118 ELEMENTS':active+' SELECTED · '+activeFilter;}
